name: Build TokEffect for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tokeffect-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TokEffect
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build optimized TokEffect executable
        run: cargo build --release --locked -p effectcraft
        env:
          EFFECTCRAFT_REQUIRE_WINRES: "1"

      - name: Prepare branded app files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'target/release/effectcraft.exe')) {
            throw 'The release executable was not produced.'
          }
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item 'target/release/effectcraft.exe' 'dist/TokEffect.exe' -Force

          # build.rs generates the TokEffect ICO directly from the project logo and embeds
          # it into the EXE. Reuse that exact ICO for the installer wizard too.
          $icon = Get-ChildItem -Path 'target/release/build' -Filter 'tokeffect.ico' -Recurse |
            Select-Object -First 1
          if (-not $icon) { throw 'The TokEffect ICO generated by build.rs was not found.' }
          Copy-Item $icon.FullName 'dist/tokeffect.ico' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) {
            throw 'Inno Setup compiler (ISCC.exe) is not available.'
          }
          (Split-Path -Parent $compiler) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build TokEffect installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = Select-String -Path 'Cargo.toml' -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1
          if (-not $versionLine) { throw 'Could not read the workspace version from Cargo.toml.' }
          $version = $versionLine.Matches[0].Groups[1].Value
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DMyAppVersion=$version" 'packaging/windows/TokEffect.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload TokEffect for Windows
        uses: actions/upload-artifact@v7
        with:
          name: TokEffect-Windows
          path: |
            dist/TokEffect.exe
            dist/TokEffect-Setup.exe
          if-no-files-found: error
          retention-days: 14
