name: Build Tokeffects for Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tokeffects-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Tokeffects
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build optimized Tokeffects executable
        run: cargo build --release --locked -p tokeffects
        env:
          TOKEEFFECTS_REQUIRE_WINRES: "1"

      - name: Prepare branded app files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'target/release/tokeffects.exe')) {
            throw 'The release executable was not produced.'
          }
          New-Item -ItemType Directory -Force -Path 'dist' | Out-Null
          Copy-Item 'target/release/tokeffects.exe' 'dist/Tokeffects-App.exe' -Force

          # build.rs writes the ICO in Cargo's OUT_DIR under target/release/build/.
          # Search the package build outputs instead of assuming Cargo preserves a profile-level copy.
          $icons = @(Get-ChildItem -Path 'target/release/build' -Filter 'tokeffects.ico' -File -Recurse |
            Sort-Object LastWriteTime -Descending)
          if ($icons.Count -eq 0) {
            $available = @(Get-ChildItem -Path 'target/release/build' -Filter '*.ico' -File -Recurse |
              Select-Object -ExpandProperty FullName)
            throw "Tokeffects ICO was not generated under target/release/build. Found other ICO files: $($available -join ', ')"
          }
          Copy-Item $icons[0].FullName 'dist/tokeffects.ico' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) {
            throw 'Inno Setup compiler (ISCC.exe) is not available.'
          }
          (Split-Path -Parent $compiler) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build Tokeffects installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = Select-String -Path 'Cargo.toml' -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1
          if (-not $versionLine) { throw 'Could not read the workspace version from Cargo.toml.' }
          $version = $versionLine.Matches[0].Groups[1].Value
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DMyAppVersion=$version" 'packaging/windows/Tokeffects.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'dist/Tokeffects.exe')) { throw 'The single-file Tokeffects installer was not produced.' }

      - name: Upload single-file Tokeffects installer
        uses: actions/upload-artifact@v7
        with:
          name: Tokeffects-Windows
          path: dist/Tokeffects.exe
          if-no-files-found: error
          retention-days: 14
